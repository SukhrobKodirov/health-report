name: lint

on:
 push:
  branches: [main]
 pull_request:

jobs:
 shell:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - name: ShellCheck
     run: shellcheck checks/*.sh
 
 python:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: astral-sh/setup-uv@v5
   - name: Ruff
     run: uvx ruff check src/
   - name: Tests
     run: uv run pytest -v
   - name: Smoke test
     run: PYTHONPATH=src python3 -m healthreport
     
